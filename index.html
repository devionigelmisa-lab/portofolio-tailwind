<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek & Tugas JS | Devioni</title>
    <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-sm w-full top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-indigo-600">Devioni.dev</a>
            <a href="index.html" class="text-sm font-medium hover:text-indigo-600 transition">← Kembali ke Beranda</a>
        </div>
    </nav>

    <!-- KONTEN UTAMA: TUGAS JAVASCRIPT -->
    <main class="py-12 px-4 max-w-2xl mx-auto w-full">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">Tugas JavaScript: Simulasi Nilai Matakuliah</h2>
            <p class="text-gray-500 text-sm text-center mb-6">Masukkan nilai Tugas, UTS, dan UAS untuk menghitung nilai akhir secara otomatis.</p>

            <!-- Form Input -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Nilai Tugas (20%)</label>
                    <input type="number" id="nilaiTugas" placeholder="0 - 100" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Nilai UTS (35%)</label>
                    <input type="number" id="nilaiUTS" placeholder="0 - 100" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Nilai UAS (45%)</label>
                    <input type="number" id="nilaiUAS" placeholder="0 - 100" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>

                <button onclick="hitungsNilai()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-md hover:bg-indigo-700 transition mt-4">
                    Hitung Nilai Akhir
                </button>
            </div>

            <!-- Hasil Output (Hidden Awalnya) -->
            <div id="hasilBox" class="hidden mt-6 p-4 rounded-xl bg-indigo-50 border border-indigo-200 text-center">
                <h3 class="text-sm font-semibold text-gray-600">Nilai Akhir Kamu:</h3>
                <p id="nilaiAngka" class="text-3xl font-extrabold text-indigo-600 my-1">0</p>
                <p id="nilaiHuruf" class="text-lg font-bold text-gray-800">Grade: -</p>
                <p id="statusLulus" class="text-sm font-medium mt-1"></p>
            </div>
        </div>
    </main>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        function hitungsNilai() {
            // 1. Mengambil Nilai Input
            const tugas = parseFloat(document.getElementById('nilaiTugas').value) || 0;
            const uts = parseFloat(document.getElementById('nilaiUTS').value) || 0;
            const uas = parseFloat(document.getElementById('nilaiUAS').value) || 0;

            // 2. Proses Perhitungan Bobot
            const nilaiAkhir = (tugas * 0.20) + (uts * 0.35) + (uas * 0.45);

            // 3. Menentukan Grade Huruf
            let grade = '';
            let status = '';
            let statusColor = '';

            if (nilaiAkhir >= 85) {
                grade = 'A (Sangat Memuaskan)';
                status = 'LULUS';
                statusColor = 'text-green-600';
            } else if (nilaiAkhir >= 70) {
                grade = 'B (Baik)';
                status = 'LULUS';
                statusColor = 'text-green-600';
            } else if (nilaiAkhir >= 55) {
                grade = 'C (Cukup)';
                status = 'LULUS';
                statusColor = 'text-yellow-600';
            } else {
                grade = 'D (Kurang)';
                status = 'TIDAK LULUS';
                statusColor = 'text-red-600';
            }

            // 4. Menampilkan Hasil ke DOM
            document.getElementById('nilaiAngka').innerText = nilaiAkhir.toFixed(1);
            document.getElementById('nilaiHuruf').innerText = 'Grade: ' + grade;
            
            const statusEl = document.getElementById('statusLulus');
            statusEl.innerText = 'Status: ' + status;
            statusEl.className = 'text-sm font-bold mt-1 ' + statusColor;

            // Tampilkan Box Hasil
            document.getElementById('hasilBox').classList.remove('hidden');
        }
    </script>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-white text-center py-6 text-sm">
        <p>&copy; 2026 Devioni Gelmisa Damanik. All rights reserved.</p>
    </footer>

</body>
</html>

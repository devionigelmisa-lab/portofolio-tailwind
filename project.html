<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas JavaScript | Devioni Gelmisa Damanik</title>
    <!-- Menghubungkan ke Tailwind CSS -->
    <link rel="stylesheet" href="dist/output.css">
</head>

<body class="bg-gray-100 font-sans p-4 md:p-8">

    <main>
        <!-- NAVIGASI KEMBALI SEDERHANA -->
        <div class="max-w-2xl mx-auto mb-4 text-left">
            <a href="index.html" class="bg-gray-300 text-gray-800 text-xs md:text-sm font-semibold px-3 py-1.5 rounded hover:bg-gray-400 transition inline-block">
                ← Kembali ke Beranda
            </a>
        </div>

        <!-- WADAH KARTU TUGAS JS (SELARAS DENGAN BIODATA) -->
        <div class="max-w-2xl mx-auto bg-[#e6e6e6] border border-gray-400 p-4 md:p-6 shadow-sm text-black">
            
            <h4 class="font-bold text-sm md:text-base mb-1">Tugas JavaScript: Simulasi Nilai Matakuliah</h4>
            <hr class="border-t border-gray-400 mb-4">

            <p class="text-xs md:text-sm text-gray-700 mb-4">
                Masukkan nilai Tugas, UTS, dan UAS di bawah ini untuk menghitung nilai akhir dan status kelulusan secara otomatis.
            </p>

            <!-- FORM INPUT NILAI -->
            <div class="space-y-3 text-xs md:text-sm">
                <div>
                    <label class="block font-semibold mb-1">Nilai Tugas (20%)</label>
                    <input type="number" id="nilaiTugas" placeholder="Isi angka 0 - 100" class="w-full px-3 py-1.5 border border-gray-400 bg-white focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Nilai UTS (35%)</label>
                    <input type="number" id="nilaiUTS" placeholder="Isi angka 0 - 100" class="w-full px-3 py-1.5 border border-gray-400 bg-white focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Nilai UAS (45%)</label>
                    <input type="number" id="nilaiUAS" placeholder="Isi angka 0 - 100" class="w-full px-3 py-1.5 border border-gray-400 bg-white focus:outline-none focus:border-indigo-600">
                </div>

                <button onclick="hitungsNilai()" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded mt-2 hover:bg-indigo-700 transition">
                    Hitung Nilai Akhir
                </button>
            </div>

            <!-- HASIL KELUARAN (BOX PUTIH BERBINGKAI) -->
            <div id="hasilBox" class="hidden mt-5 p-4 bg-white border border-gray-500 text-center">
                <h5 class="text-xs font-bold text-gray-600">NILAI AKHIR KAMU:</h5>
                <p id="nilaiAngka" class="text-2xl md:text-3xl font-extrabold text-indigo-600 my-1">0</p>
                <p id="nilaiHuruf" class="text-sm font-bold text-gray-800">Grade: -</p>
                <p id="statusLulus" class="text-xs font-bold mt-1"></p>
            </div>

        </div>
    </main>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        function hitungsNilai() {
            const tugas = parseFloat(document.getElementById('nilaiTugas').value) || 0;
            const uts = parseFloat(document.getElementById('nilaiUTS').value) || 0;
            const uas = parseFloat(document.getElementById('nilaiUAS').value) || 0;

            // Perhitungan Bobot Nilai
            const nilaiAkhir = (tugas * 0.20) + (uts * 0.35) + (uas * 0.45);

            let grade = '';
            let status = '';
            let statusColor = '';

            if (nilaiAkhir >= 85) {
                grade = 'A (Sangat Memuaskan)';
                status = 'LULUS';
                statusColor = 'text-green-700';
            } else if (nilaiAkhir >= 70) {
                grade = 'B (Baik)';
                status = 'LULUS';
                statusColor = 'text-green-700';
            } else if (nilaiAkhir >= 55) {
                grade = 'C (Cukup)';
                status = 'LULUS';
                statusColor = 'text-yellow-700';
            } else {
                grade = 'D (Kurang)';
                status = 'TIDAK LULUS';
                statusColor = 'text-red-700';
            }

            // Tampilkan ke Elemen HTML
            document.getElementById('nilaiAngka').innerText = nilaiAkhir.toFixed(1);
            document.getElementById('nilaiHuruf').innerText = 'Grade: ' + grade;
            
            const statusEl = document.getElementById('statusLulus');
            statusEl.innerText = 'Status: ' + status;
            statusEl.className = 'text-xs font-bold mt-1 ' + statusColor;

            // Unhide Box Hasil
            document.getElementById('hasilBox').classList.remove('hidden');
        }
    </script>

</body>

</html>
